<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School ERP Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:235px;background:#10233f;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;padding:10px 12px 22px}.nav button{width:100%;border:0;background:transparent;color:#dbe5f5;text-align:left;padding:12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#24466f}.main{margin-left:235px;padding:26px;max-width:1500px;flex:1}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e4eaf2;border-radius:13px;padding:18px;box-shadow:0 2px 10px #10233f0b}.num{font-size:28px;font-weight:800;margin-top:6px}.muted{color:#6b778c;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.input,select{padding:10px;border:1px solid #ccd6e5;border-radius:8px;background:#fff}.btn{border:0;background:#1769e0;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eef7;color:#19385f}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #edf1f6;text-align:left}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover}.row{display:flex;gap:9px;align-items:center}.hidden{display:none}.modal{position:fixed;inset:0;background:#071426aa;display:flex;align-items:center;justify-content:center;padding:14px}.box{background:#fff;border-radius:15px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:#5e6c80}.form input,.form select{width:100%;margin-top:5px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.profile{display:grid;grid-template-columns:120px 1fr;gap:18px}.profile img{width:120px;height:150px;object-fit:cover;border-radius:12px}.tabs{display:flex;gap:5px;border-bottom:1px solid #ddd;margin-top:20px;overflow:auto}.tabs button{border:0;background:none;padding:10px;cursor:pointer}.tabs button.active{color:#1769e0;border-bottom:2px solid #1769e0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#10233f;color:#fff;padding:12px 18px;border-radius:10px;display:none}.toast.show{display:block}
@media(max-width:800px){.side{width:66px}.brand{font-size:0}.brand:after{content:'ERP';font-size:17px}.nav button{font-size:0;text-align:center}.nav button:after{content:'•';font-size:20px}.main{margin-left:66px;padding:14px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.profile{grid-template-columns:1fr;text-align:center}.profile img{margin:auto}.table{font-size:13px}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">🏫 School ERP</div><div class="nav">
<button class="active" onclick="page('dash',this)">📊 Dashboard</button><button onclick="page('students',this)">👨‍🎓 Students</button><button onclick="page('classes',this)">🏫 Classes</button><button onclick="page('settings',this)">⚙️ Settings</button>
</div></aside><main class="main">
<section id="dash"><div class="top"><h1>Dashboard</h1><button class="btn" onclick="openStudent()">+ Add Student</button></div><div class="cards">
<div class="card"><div class="muted">Total Students</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">Classes</div><div class="num" id="classesCount">0</div></div><div class="card"><div class="muted">Attendance</div><div class="num">—</div></div><div class="card"><div class="muted">Results</div><div class="num">—</div></div></div><div class="panel" style="margin-top:16px"><h3>Recent Students</h3><div id="recent"></div></div></section>
<section id="students" class="hidden"><div class="top"><h1>Students</h1><button class="btn" onclick="openStudent()">+ Add Student</button></div><div class="toolbar"><input id="q" class="input" placeholder="Search student..." oninput="loadStudents()"><select id="filterClass" onchange="loadStudents()"><option value="">All classes</option></select></div><div class="panel"><table class="table"><thead><tr><th>Student</th><th>Class</th><th>Roll</th><th>Father</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></section>
<section id="classes" class="hidden"><div class="top"><h1>Classes</h1></div><div class="panel" id="classList"></div></section>
<section id="settings" class="hidden"><div class="top"><h1>School Settings</h1></div><div class="panel"><div class="form"><label class="full">School Name<input id="school" class="input"></label><label>Academic Session<input id="session" class="input"></label><label>Principal<input id="principal" class="input"></label></div><div class="actions"><button class="btn" onclick="saveSettings()">Save Settings</button></div></div></section>
</main></div>

<div id="modal" class="modal hidden"><div class="box"><h2>Add Student</h2><form id="studentForm" class="form" enctype="multipart/form-data">
<label>Name<input name="name" required class="input"></label><label>Father's Name<input name="father" class="input"></label><label>Mother's Name<input name="mother" class="input"></label><label>Date of Birth<input name="dob" type="date" class="input"></label>
<label>Class<select name="class" class="input"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Section<input name="section" value="A" class="input"></label><label>Roll Number<input name="roll" class="input"></label><label>Phone<input name="phone" class="input"></label><label class="full">Address<input name="address" class="input"></label><label class="full">Photo<input name="photo" type="file" accept="image/*" class="input"></label>
<div class="actions full"><button type="button" class="btn secondary" onclick="closeStudent()">Cancel</button><button type="submit" class="btn">Save Student</button></div></form></div></div>

<div id="profile" class="modal hidden"><div class="box"><div class="top"><h2 id="ptitle">Student Profile</h2><button class="btn secondary" onclick="closeProfile()">Close</button></div><div id="profileBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
let current=null,settings={school_name:'My School',session:'2026-27',principal:'Principal'};
const $=x=>document.getElementById(x);
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function api(url,opt={}){let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function page(id,b){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='dash')loadDash();if(id==='students')loadStudents();if(id==='classes')loadClasses();if(id==='settings')loadSettings()}
async function loadDash(){let d=await api('/api/dashboard');$('total').textContent=d.totalStudents;$('classesCount').textContent=d.totalClasses;let s=await api('/api/students');$('recent').innerHTML=s.slice(0,8).map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee;cursor:pointer" onclick="openProfile(${x.id})">${x.photo?`<img class="avatar" src="${x.photo}">`:'👤'}<b>${x.name}</b><span class="muted">Class ${x.class}-${x.section} · Roll ${x.roll}</span></div>`).join('')||'<p class="muted">No students yet.</p>'}
async function loadStudents(){let q=$('q').value,c=$('filterClass').value,s=await api('/api/students?'+new URLSearchParams({q,class:c}));let all=await api('/api/students');let cs=[...new Set(all.map(x=>x.class))].sort((a,b)=>a-b);$('filterClass').innerHTML='<option value="">All classes</option>'+cs.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('');$('studentRows').innerHTML=s.map(x=>`<tr><td><div class="row" onclick="openProfile(${x.id})" style="cursor:pointer">${x.photo?`<img class="avatar" src="${x.photo}">`:'👤'}<b>${x.name}</b></div></td><td>${x.class}-${x.section}</td><td>${x.roll}</td><td>${x.father||'—'}</td><td><button class="btn" onclick="openProfile(${x.id})">Profile</button></td></tr>`).join('')||'<tr><td colspan="5">No students found.</td></tr>'}
async function loadClasses(){let s=await api('/api/students');let m={};s.forEach(x=>m[x.class]=(m[x.class]||0)+1);$('classList').innerHTML=Object.keys(m).sort((a,b)=>a-b).map(c=>`<div class="card" style="display:inline-block;width:180px;margin:7px"><b>Class ${c}</b><div class="num">${m[c]}</div><div class="muted">students</div></div>`).join('')||'<p>No students yet.</p>'}
async function loadSettings(){settings=await api('/api/settings');$('school').value=settings.school_name;$('session').value=settings.session;$('principal').value=settings.principal}
async function saveSettings(){await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({school_name:$('school').value,session:$('session').value,principal:$('principal').value})});toast('✓ Settings saved')}
function openStudent(){$('studentForm').reset();$('modal').classList.remove('hidden')}
function closeStudent(){$('modal').classList.add('hidden')}
$('studentForm').onsubmit=async e=>{e.preventDefault();let b=new FormData(e.target);try{await fetch('/api/students',{method:'POST',body:b}).then(async r=>{let d=await r.json();if(!r.ok)throw new Error(d.error)});closeStudent();toast('✓ Student saved');await loadDash();setTimeout(async()=>{let s=await api('/api/students');if(s[0])openProfile(s[0].id)},250)}catch(err){alert(err.message)}}
async function openProfile(id){let s=await api('/api/students/'+id);current=s;$('ptitle').textContent=s.name;$('profile').classList.remove('hidden');renderProfile('details')}
function closeProfile(){$('profile').classList.add('hidden')}
function renderProfile(tab){let s=current,m=s.marks||{},subs=[['hindi','Hindi'],['english','English'],['mathematics','Mathematics'],['science','Science'],['social_science','Social Science']],total=subs.reduce((a,[k])=>a+Number(m[k]||0),0),pct=total/5,grade=pct>=90?'A+':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';$('profileBody').innerHTML=`<div class="profile">${s.photo?`<img src="${s.photo}">`:`<div style="font-size:70px;text-align:center">👤</div>`}<div><h2>${s.name}</h2><p>Class ${s.class}-${s.section} · Roll ${s.roll||'—'}</p><p>Father: ${s.father||'—'} · Mother: ${s.mother||'—'}</p><p>DOB: ${s.dob||'—'} · Phone: ${s.phone||'—'}</p></div></div><div class="tabs"><button class="${tab==='details'?'active':''}" onclick="renderProfile('details')">Details</button><button class="${tab==='marks'?'active':''}" onclick="renderProfile('marks')">Marks</button><button class="${tab==='documents'?'active':''}" onclick="renderProfile('documents')">Documents</button><button class="${tab==='attendance'?'active':''}" onclick="renderProfile('attendance')">Attendance</button></div><div style="padding-top:18px">${tab==='details'?`<p><b>Address:</b> ${s.address||'—'}</p><button class="btn secondary" onclick="deleteStudent(${s.id})">Delete Student</button>`:tab==='marks'?`<div class="card"><b>Total:</b> ${total}/500 &nbsp; <b>Percentage:</b> ${pct.toFixed(2)}% &nbsp; <b>Grade:</b> ${grade}</div><table class="table"><tr><th>Subject</th><th>Marks</th></tr>${subs.map(([k,n])=>`<tr><td>${n}</td><td>${m[k]??0}</td></tr>`).join('')}</table><button class="btn" onclick="editMarks()">Save Marks</button>`:tab==='documents'?`<div class="toolbar"><button class="btn" onclick="printDoc('ID CARD')">🪪 ID Card</button><button class="btn" onclick="printDoc('MARKSHEET')">📄 Marksheet</button><button class="btn" onclick="printDoc('ADMIT CARD')">🎫 Admit Card</button></div>`:`<p class="muted">Attendance module will be connected here.</p>`}</div>`}
function editMarks(){let s=current,m=s.marks||{},v=prompt('Enter 5 marks separated by commas (Hindi, English, Maths, Science, Social Science):',[m.hindi||0,m.english||0,m.mathematics||0,m.science||0,m.social_science||0].join(','));if(!v)return;let a=v.split(',').map(Number);if(a.length!==5)return alert('Enter exactly 5 values');api('/api/students/'+s.id+'/marks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hindi:a[0],english:a[1],mathematics:a[2],science:a[3],social_science:a[4]})}).then(()=>api('/api/students/'+s.id)).then(x=>{current=x;renderProfile('marks');toast('✓ Marks saved')}).catch(e=>alert(e.message))}
async function deleteStudent(id){if(!confirm('Delete this student?'))return;await api('/api/students/'+id,{method:'DELETE'});closeProfile();loadDash();toast('Student deleted')}
function printDoc(title){let s=current,m=s.marks||{},rows=[['Hindi',m.hindi||0],['English',m.english||0],['Mathematics',m.mathematics||0],['Science',m.science||0],['Social Science',m.social_science||0]];let total=rows.reduce((a,x)=>a+Number(x[1]),0);let w=open('','_blank');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:30px}.box{border:2px solid #111;padding:25px;max-width:700px;margin:auto}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:9px}</style></head><body><div class="box"><h1 style="text-align:center">${settings.school_name||'My School'}</h1><h2 style="text-align:center">${title}</h2><p><b>Name:</b> ${s.name}</p><p><b>Father:</b> ${s.father||'—'} &nbsp; <b>Mother:</b> ${s.mother||'—'}</p><p><b>Class:</b> ${s.class}-${s.section} &nbsp; <b>Roll:</b> ${s.roll||'—'}</p>${title==='MARKSHEET'?`<table><tr><th>Subject</th><th>Marks</th></tr>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><p><b>Total:</b> ${total}/500 &nbsp; <b>Percentage:</b> ${(total/5).toFixed(2)}%</p>`:''}<p>Session: ${settings.session||'2026-27'}</p><br>Principal Signature: __________________</div><script>print()<\/script></body></html>`);w.document.close()}
loadDash();
</script></body></html>
